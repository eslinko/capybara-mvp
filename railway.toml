# Thin Railway wiring for Capybara host (HOST-02 · EDGE · WPROOF).
# Secrets / PORT live in Railway variables — not in this file (AC-H02).
# Dockerfile includes host/ + packages/core (auth requires).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
