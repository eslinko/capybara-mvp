# Thin Railway wiring for Capybara host (HOST-02 · arch DP6-C).
# Secrets / PORT live in Railway variables — not in this file (AC-H02).
# Git + RAILPACK (no Docker) — Phase 1 host entry via npm start.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
